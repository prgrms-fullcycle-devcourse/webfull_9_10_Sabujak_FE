    <title>Heart Jar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: linear-gradient(180deg, #f7f2e8 0%, #eef8ff 100%);
            --ink: #27525c;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        .wrap {
            width: 340px;
            max-width: 90vw;
            text-align: center;
        }

        .title {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 800;
            color: var(--ink);
        }


        svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .heart {
            transform-box: fill-box;
            transform-origin: center;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.35));
        }

        .jar-shadow {
            filter: drop-shadow(0 18px 18px rgba(36, 79, 90, 0.12));
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        const MESSAGE_TOTAL = 4;
        const MAX_HEARTS = 50;
        const HEART_SCALE_MIN = 0.2;
        const HEART_SCALE_MAX = 0.8;

        const heartLayer = document.getElementById("heartLayer");
        const JAR_BOUNDS = {
            centerX: 125.5,
            top: 265,
            bottom: 345
        };

        const HEART_BOX = {
            width: 10,
            centerX: 15,
            centerYOffset: 4
        };

        function clampHeartCount(total) {
            return Math.max(0, Math.min(MAX_HEARTS, Number(total) || 0));
        }

        function getRandomHeartStyle() {
            const hueRanges = [
                [10, 40],   // peach / orange
                [50, 60],   // yellow
                [175, 220], // sky blue / teal green
                [332, 390]  // pink
            ];
            const [minHue, maxHue] = hueRanges[Math.floor(Math.random() * hueRanges.length)];
            const hue = gsap.utils.random(minHue, maxHue, 1);
            const saturation = gsap.utils.random(58, 72, 1);
            const lightness = gsap.utils.random(72, 80, 1);
            const strokeLightness = Math.max(50, lightness - 18);
            const scale = gsap.utils.random(HEART_SCALE_MIN, HEART_SCALE_MAX, 0.01);

            return {
                fill: `hsl(${hue} ${saturation}% ${lightness}%)`,
                stroke: `hsl(${hue} ${Math.max(48, saturation - 12)}% ${strokeLightness}%)`,
                scale
            };
        }

        function createHeartTokens(total) {
            return Array.from({ length: clampHeartCount(total) }, () => getRandomHeartStyle());
        }

        function getInnerWidthByY(y, scale = 1) {
            const progress = (y - JAR_BOUNDS.top) / (JAR_BOUNDS.bottom - JAR_BOUNDS.top);
            const eased = Math.max(0, Math.min(1, progress));

            // Bottle body: narrow near the shoulder, widest around the lower-middle,
            // and just a little tighter again near the very bottom.
            let halfWidth;
            if (eased < 0.2) {
                halfWidth = 16 + (eased / 0.2) * 7;
            } else if (eased < 0.8) {
                halfWidth = 23 + ((eased - 0.2) / 0.6) * 9;
            } else {
                halfWidth = 32 - ((eased - 0.8) / 0.2) * 3;
            }

            const safeHalf = halfWidth - ((HEART_BOX.width * scale) / 2) - 2;
            return Math.max(11, safeHalf);
        }

        function createHeart(rule) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const use = document.createElementNS("http://www.w3.org/2000/svg", "use");

            use.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#heartShape");
            use.setAttribute("href", "#heartShape");
            use.setAttribute("fill", rule.fill);
            use.setAttribute("stroke", rule.stroke);
            use.setAttribute("stroke-width", "1.8");

            group.setAttribute("class", "heart");
            group.appendChild(use);
            heartLayer.appendChild(group);

            const point = getRandomPoint(rule);

            group.dataset.speed = String(gsap.utils.random(0.78, 1.28, 0.01));
            group.dataset.scalePulse = String(gsap.utils.random(0.94, 1.08, 0.01));
            group.dataset.opacityMin = String(gsap.utils.random(0.72, 0.88, 0.01));

            gsap.set(group, {
                x: point.x,
                y: point.y,
                scale: rule.scale,
                opacity: 0.96,
                rotation: gsap.utils.random(-18, 18),
                transformOrigin: "15px 8px"
            });

            return group;
        }

        function getRandomPoint(rule) {
            const centerY = gsap.utils.random(JAR_BOUNDS.top, JAR_BOUNDS.bottom);
            const halfWidth = getInnerWidthByY(centerY, rule.scale);
            const centerX = gsap.utils.random(JAR_BOUNDS.centerX - halfWidth, JAR_BOUNDS.centerX + halfWidth);

            return {
                x: centerX - HEART_BOX.centerX,
                y: centerY + HEART_BOX.centerYOffset
            };
        }

        function floatHeart(heart, rule) {
            const next = getRandomPoint(rule);
            const speed = Number(heart.dataset.speed || 1);
            const scalePulse = Number(heart.dataset.scalePulse || 1);
            const opacityMin = Number(heart.dataset.opacityMin || 0.8);
            const duration = gsap.utils.random(2.8, 5.6) / speed;

            gsap.to(heart, {
                duration,
                x: next.x,
                y: next.y,
                rotation: gsap.utils.random(-20, 20),
                ease: "sine.inOut",
                onComplete: () => floatHeart(heart, rule)
            });

            gsap.to(heart, {
                duration: gsap.utils.random(1.8, 3.2) / speed,
                scale: rule.scale * scalePulse,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut"
            });

            gsap.to(heart, {
                duration: gsap.utils.random(2.5, 4.4) / speed,
                opacity: gsap.utils.random(opacityMin, 1, 0.01),
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut"
            });
        }

        function buildScene(total) {
            heartLayer.innerHTML = "";

            const tokens = createHeartTokens(total);
            if (!tokens.length) {
                return;
            }

            tokens.forEach((rule, index) => {
                const heart = createHeart(rule);

                gsap.delayedCall(index * 0.08, () => {
                    floatHeart(heart, rule);
                });
            });
        }

        function setHeartTotal(total) {
            buildScene(total);
        }

        window.setHeartTotal = setHeartTotal;

        buildScene(MESSAGE_TOTAL);
    </script>
